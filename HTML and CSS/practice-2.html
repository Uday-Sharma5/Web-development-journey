<style>

    {
background-color: rgb(178, 3, 3);

height: 35px;
border: none;
transition: 1s;
}
.Subscribe-button:hover{
    opacity: 0.3;
}

.Subscribe-button:active{
    opacity: 0.2;
}

.Join-button
{
background-color: white;
border-color: rgb(47, 77, 246);
border-style: solid;
border-width: 1px;

width: 80;
border-radius: 2px;

transition: 1s;

}
.Join-button:hover{
    background-color: skyblue;
}
.Join-button:active{
    opacity: 0.4;
}

.Tweet-button{
    background-color: rgb(15, 120, 161);

</button>
